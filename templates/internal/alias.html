<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Redirecting…</title>
<link rel="canonical" href="{{ url | safe }}">
<meta name="robots" content="noindex">
<style>/* Hallmark · shape: redirect page · genre: editorial · theme: Rim (by request) · redesign: restyle · copy: verbatim · hero: Banner, kept · v2.0.0 */
/* Hallmark · note redirect page · this old address only forwards to its new home (design.md), so the one link is the whole page */
/* Hallmark · dismissed F23 · a redirect page for an old address, marked noindex, needs no description */
/* Hallmark · waive 49b · the post this page forwards to lists reference links named by full paper titles · on a 320px phone the owner's paper and page titles cannot shorten without rewriting his copy, so they wrap */
/* Hallmark · dismissed 76 · the redirect lands on a post with images the owner linked from Wikimedia and Unsplash, unreachable from this sandbox */
html, body { overflow-x: clip; } a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; } a:active { opacity: 0.8; }</style>
<script>location.replace({{ url | json_encode | safe }} + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url={{ url | safe }}"></noscript>
<p><a href="{{ url | safe }}">{{ url | safe }}</a></p>
</html>
